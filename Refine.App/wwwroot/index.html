<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Refine.App</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&amp;family=Inter:wght@400;500;600&amp;family=Lexend:wght@700&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/refine-components.css" />
    <link rel="stylesheet" href="Refine.App.styles.css" />
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body style="background-color: #0d0d0d; margin: 0; padding: 0;">

    <div class="status-bar-safe-area"></div>

    <div id="app"></div>

    <div id="blazor-error-ui"
        style="display: none; background-color: #7f1d1d; color: white; padding: 16px; position: fixed; bottom: 0; width: 100%; z-index: 50;">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <span>An unhandled error has occurred.</span>
            <div>
                <a href=""
                    style="text-decoration: underline; margin-right: 16px; cursor: pointer; color: white;">Reload</a>
                <a class="dismiss" style="cursor: pointer; font-weight: bold; color: white;">🗙</a>
            </div>
        </div>
    </div>


    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script src="lib/chartjs/chart.umd.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script>
        window.initSortable = (elementId, instance) => {
            var el = document.getElementById(elementId);
            if (!el) return;

            new Sortable(el, {
                animation: 200,
                handle: '.drag-handle',
                delay: 100,
                delayOnTouchOnly: true,

                // --- KRİTİK AYARLAR ---
                forceFallback: true,        // HTML5 Drag'i devre dışı bırak, JS kullan (Hayalet kutuyu engeller)
                fallbackClass: "sortable-fallback",  // Sürüklenen öğeye stil vermek için
                fallbackOnBody: true,       // Mobilde daha akıcı olması için
                touchStartThreshold: 5,     // Hafif titremelerde sürüklemeyi başlatma
                // ---------------------

                onEnd: (evt) => {
                    instance.invokeMethodAsync('OnUpdateOrder', evt.oldIndex, evt.newIndex);
                }
            });
        };
    </script>
</body>

</body>

</html>
